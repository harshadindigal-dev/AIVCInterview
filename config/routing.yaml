  email: intake-review@ashcombe.example
  slack: "#intake-review"

# service_line -> team_leads key. Kept explicit so a line can be pointed at
# another lead (e.g. during leave) without renaming anything.
routing_table:
  audit: audit
  tax: tax
  deals: deals
  risk_reg: risk_reg
  tech: tech
  people: people
  strategy: strategy

# Override rules, applied in this order. The first terminal rule decides the
# destination; every rule evaluated is written to the routing trace.
rules:
  - id: hard_stop_review
    description: Possible injection, conflict flag or classification failure -> review queue, before any other rule
  - id: manual_mode
    description: Automatic routing paused, or the service line is in fallback mode -> review queue
  - id: archive_not_an_enquiry
    description: not_an_enquiry -> archive, no notification
  - id: existing_client
    description: Existing client in CRM -> relationship partner, service-line lead copied
  - id: review_flags
    description: Any review trigger -> review queue
  - id: complex_high_urgency
    description: complex + high urgency -> service-line lead, practice head copied
  - id: default
    description: Otherwise -> service-line lead

# Fallback controls: switches for when something is wrong. They send enquiries
# to a person instead of routing automatically, with no code change.
fallback:
  # Everything goes to the review queue (e.g. during a provider incident or a bad prompt change).
  pause_automatic_routing: false
  # Service lines whose enquiries go to review while a problem with them is investigated.
  degraded_service_lines: []
  # Only archive spam / job applications / pitches when all three runs agree; otherwise review.
  archive_requires_unanimous_runs: true
  # A routed enquiry nobody has accepted or reassigned within this many hours is
  # escalated to the review queue. Keyed by urgency (the higher of stated and inferred).
  acknowledgement_hours:
    high: 4
    normal: 24
    low: 48

# Hard stops: checked first, so nothing (including the existing-client rule)
# can route these automatically.
hard_stops:
  flags:
    - possible_injection
  on_conflict_flag: true
  on_classification_failure: true

# Review-queue triggers (section 5.4), applied after the existing-client rule.
review:
  # Number of the 3 runs whose service line must match the primary run.
  min_service_line_agreement: 3
  # Complexity disagreement is recorded and shown but does not trigger review
  # unless this is raised above 1.
  min_complexity_agreement: 1
  # Flags that do NOT on their own send an enquiry to review.
  exempt_flags:
    - urgency_mismatch
    - multi_service
  # Conflict and classification failure are hard stops (see above).
  # out_of_scope as the primary line always goes to review (it is also a flag).
  review_on_out_of_scope: true

# Window for duplicate detection (same email + same normalised description).
dedupe_window_days: 7
